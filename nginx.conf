# Run workers as root — suppresses the master→worker chown() call that
# nginx performs when starting as root and switching to another user.
# The container already runs as UID 0 (see openshift.yaml securityContext),
# so this is consistent with the declared runtime identity.
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Redirect temp paths to /tmp/nginx/* so they are writable by any UID
    client_body_temp_path  /tmp/nginx/client_body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    # Needed for WebSocket upgrade header map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Serve the split-panel frontend
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy all ttyd traffic (HTTP + WebSocket) to ttyd on port 7681
        location /ttyd/ {
            proxy_pass http://127.0.0.1:7681;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
